name: entra-federation-proof

# Proves an app can authenticate to Microsoft Graph with NO standing secret.
# GitHub mints a short-lived OIDC token, Entra trusts it through a federated
# identity credential, and the job exchanges that token directly for a Graph
# token. There is no client secret or certificate anywhere in this repo.
#
# The token is acquired with the federated client-assertion flow rather than
# through `azure/login` + `az rest`: azure/login consumes the single-use OIDC
# token to get an Azure Resource Manager token, after which the CLI can no
# longer mint a separate Microsoft Graph token. Doing the exchange directly
# avoids that and keeps the whole flow visible.

on:
  workflow_dispatch:

permissions:
  id-token: write   # required: lets the job request a GitHub OIDC token
  contents: read

jobs:
  prove-no-secret:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}   # repo VARIABLE, not a secret
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}   # repo VARIABLE, not a secret
    steps:
      - name: Get a Graph token via OIDC federation and call Graph (no secret)
        run: |
          set -euo pipefail

          # 1. Ask GitHub for an OIDC token whose audience matches the Entra
          #    federated credential (the GitHub Actions scenario uses this one).
          OIDC_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | jq -r '.value')
          [ -n "$OIDC_TOKEN" ] && [ "$OIDC_TOKEN" != "null" ] || { echo "No OIDC token from GitHub"; exit 1; }

          # 2. Exchange it for a Microsoft Graph token. The GitHub token is the
          #    client assertion; there is no client secret in this request.
          RESP=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${AZURE_CLIENT_ID}" \
            -d "grant_type=client_credentials" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            -d "client_assertion=${OIDC_TOKEN}")
          GRAPH_TOKEN=$(echo "$RESP" | jq -r '.access_token // empty')
          if [ -z "$GRAPH_TOKEN" ]; then echo "Token exchange failed:"; echo "$RESP" | jq .; exit 1; fi

          echo "Acquired a Microsoft Graph token with no standing secret."

          # 3. Call Microsoft Graph with the federated token.
          curl -sS -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            'https://graph.microsoft.com/v1.0/applications?$top=1&$select=displayName' \
            | jq .
